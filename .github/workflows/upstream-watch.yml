name: Upstream Watch

on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * 1"

jobs:
  upstream-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync --extra dev
      - name: Check upstream framework drift
        run: uv run earthswarm upstream check --config upstreams.yaml --json
