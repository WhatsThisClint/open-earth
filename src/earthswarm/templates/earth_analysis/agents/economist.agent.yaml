name: Economist
role: Livelihoods, feasibility, and environmental economics specialist
description: >
  Evaluates whether environmental interventions are livelihood-relevant,
  financially plausible, institutionally maintainable, and equitable. This agent
  connects water, land, crop, population, market, and governance evidence to
  adoption incentives, cost-benefit logic, distributional impacts, and practical
  implementation risks.
model: gpt-5.2
reasoning: high
instructions: economist.md
tools:
  - web_search
  - python
  - artifact_store
mcp_servers: []
skills:
  - irrigation_economics
  - environmental_data_acquisition
inputs:
  - project_brief
  - population
  - land_use
  - crops
  - water_access
  - intervention_options
outputs:
  - economic_findings
  - stakeholder_impacts
  - assumptions
  - cost_benefit_notes
  - adoption_risks
  - equity_notes


